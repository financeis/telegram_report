# 유사 기업 동의어표: 표준 표기 → 다른 표기 목록.
#
# 용어 비교 열쇠를 만들 때, 용어 전체가 다른 표기와 같으면 표준 표기로 바꾼다(대소문자·공백·
# 가운뎃점·하이픈은 따로 무시하므로 여기 적지 않아도 된다). 공통 키워드와 테마 검색이 이 열쇠로
# 비교하고, 화면에는 표준 표기가 보인다. 근거 검사는 표준 표기와 다른 표기 중 하나라도
# 사업보고서 글에 있으면 그 용어가 글에 있다고 본다.
#
# - 처음엔 작게 시작하고 시험 실행(peers build --pilot) 결과를 보며 늘린다.
# - 한 표기는 표준 하나에만 속해야 한다. 다른 항목의 표준 표기를 다른 표기로 적으면 읽지 못한다.
# - 고치면 다음 공개 빌드가 용어 열과 용어표를 새로 쓴다. AI 추출은 다시 하지 않는다.
# - 다른 단어 안의 표기는 바꾸지 않는다: `시디램프`는 DRAM이 아니고, `Legacy 디램`은
#   `Legacy DRAM`과 다른 용어다. 이런 묶음이 필요하면 그 용어 전체를 다른 표기로 적는다.

DRAM: [디램, D램]
이차전지: [2차전지]
양극재: [양극활물질]
음극재: [음극활물질]
MLCC: [적층세라믹콘덴서, 적층세라믹커패시터]
HBM: [고대역폭메모리]
OLED: [유기발광다이오드]
PCB: [인쇄회로기판]
