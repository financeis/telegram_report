# 유사 기업 동의어표: 표준 표기 → 다른 표기 목록.
#
# 용어 비교 열쇠를 만들 때 다른 표기를 표준 표기로 바꾼다(대소문자·공백·가운뎃점·하이픈은
# 따로 무시하므로 여기 적지 않아도 된다). 근거 검사, 공통 키워드, 테마 검색이 모두 이 열쇠로
# 비교하고, 화면에는 표준 표기가 보인다.
#
# - 처음엔 작게 시작하고 시험 실행(peers build --pilot) 결과를 보며 늘린다.
# - 한 표기는 표준 하나에만 속해야 한다. 다른 항목의 표준 표기를 다른 표기로 적으면 읽지 못한다.
# - 고치면 다음 공개 빌드가 용어 열과 용어표를 새로 쓴다. AI 추출은 다시 하지 않는다.
# - 짧은 영문 약어를 다른 표기로 넣지 않는다: 열쇠는 글자 단위로 바꾸므로 다른 단어 안에서도 바뀐다.

DRAM: [디램, D램]
이차전지: [2차전지]
양극재: [양극활물질]
음극재: [음극활물질]
MLCC: [적층세라믹콘덴서, 적층세라믹커패시터]
HBM: [고대역폭메모리]
OLED: [유기발광다이오드]
PCB: [인쇄회로기판]
