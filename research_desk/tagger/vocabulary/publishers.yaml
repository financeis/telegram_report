# 발행처 사전 — 발행처 이름의 유일한 원본이다.
# - 구역 이름(broker / data_provider / ir_agency / other)이 그 구역에 있는 발행처의 publisher_type이다.
# - canonical: 표지에 적힌 지금 회사명(한국어 정식 상호가 있으면 그것). 발행처 값은 canonical 중 하나이고, 사전에 없으면 비운다(null).
# - aliases: 옛 이름·영문 이름·약칭, 그리고 텔레그램 채널이 파일 이름 끝(_YYYYMMDD_<표기>_<숫자>.pdf)에 붙이는 표기.
#   별칭 하나는 정확히 한 항목에만 속하고, 어떤 항목의 canonical과도 같지 않다.
# 분류기 시스템 프롬프트(research_desk/tagger/prompts.py)에 이 파일이 주석까지 그대로 들어간다.
# research_desk/tagger/vocabulary/__init__.py가 같은 파일로 정식 이름·종류·파일 이름 표기를 조회한다.
